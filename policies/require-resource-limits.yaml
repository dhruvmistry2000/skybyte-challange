apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must set CPU and memory requests and limits. Without
      requests the scheduler cannot place pods on the right node; without
      limits a noisy neighbour can starve the rest of the namespace.
      The original chart shipped without resources at all, so this policy
      directly guards against the regression we fixed.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: containers-must-set-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Every container must set resources.requests and resources.limits
          for both cpu and memory.
        pattern:
          spec:
            containers:
              - name: "*"
                resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
