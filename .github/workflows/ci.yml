name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'
  HELM_RELEASE: skybyte-app
  HELM_CHART_DIR: helm/skybyte-app
  NAMESPACE: devops-challenge
  RENDERED_MANIFEST: /tmp/rendered.yaml
  IMAGE_LOCAL: skybyte/app:ci
  KYVERNO_VERSION: v1.13.4
  KUBECONFORM_VERSION: v0.7.0
  KUBERNETES_SCHEMA_VERSION: '1.29.0'
  TRIVY_VERSION: '0.70.0'
  GOOD_POD_FIXTURE: policies/tests/good-pod.yaml
  BAD_POD_FIXTURE: policies/tests/bad-pod.yaml
  POLICY_POD_SECURITY: policies/require-pod-security.yaml
  POLICY_RESOURCE_LIMITS: policies/require-resource-limits.yaml

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check app/

      - name: Unit tests
        run: pytest -v app/tests

  helm:
    name: Helm lint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar --no-same-owner -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint
        run: helm lint ${{ env.HELM_CHART_DIR }}

      - name: helm template | kubeconform + save rendered YAML
        run: |
          set -o pipefail
          helm template ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_DIR }} \
            --namespace ${{ env.NAMESPACE }} \
          | tee ${{ env.RENDERED_MANIFEST }} \
          | kubeconform \
              -strict \
              -summary \
              -kubernetes-version "${{ env.KUBERNETES_SCHEMA_VERSION }}"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: ${{ env.RENDERED_MANIFEST }}
          retention-days: 1

  policies:
    name: Kyverno policy validation
    runs-on: ubuntu-latest
    needs: helm
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install Kyverno CLI
        run: |
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" -o /tmp/kyverno.tgz
          tar -xzf /tmp/kyverno.tgz -C /tmp kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Render Helm chart
        run: helm template ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_DIR }} --namespace ${{ env.NAMESPACE }} > ${{ env.RENDERED_MANIFEST }}

      - name: Apply policies to rendered chart (must PASS)
        run: |
          kyverno apply \
            ${{ env.POLICY_POD_SECURITY }} \
            ${{ env.POLICY_RESOURCE_LIMITS }} \
            --resource ${{ env.RENDERED_MANIFEST }}

      - name: Apply policies to good-pod fixture (must PASS)
        run: |
          kyverno apply \
            ${{ env.POLICY_POD_SECURITY }} \
            ${{ env.POLICY_RESOURCE_LIMITS }} \
            --resource ${{ env.GOOD_POD_FIXTURE }}

      - name: Apply policies to bad-pod fixture (must FAIL — rejection proof)
        run: |
          set +e
          kyverno apply \
            ${{ env.POLICY_POD_SECURITY }} \
            ${{ env.POLICY_RESOURCE_LIMITS }} \
            --resource ${{ env.BAD_POD_FIXTURE }}
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "::error::Kyverno accepted the bad-pod fixture; policies are not enforcing."
            exit 1
          fi
          echo "Kyverno correctly rejected bad-pod (exit=$rc)."

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt -check
        run: terraform -chdir=terraform fmt -check

      - name: terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: terraform validate
        run: terraform -chdir=terraform validate

  docker:
    name: Multi-arch build + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 via emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE_LOCAL }}-amd64
          load: true
          provenance: false

      - name: Build linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: ${{ env.IMAGE_LOCAL }}-arm64
          load: true
          provenance: false

      - name: Install Trivy
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar --no-same-owner -xz -C /usr/local/bin trivy
          trivy --version

      - name: Trivy filesystem scan (HIGH, CRITICAL — exit 1)
        run: |
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            .

      - name: Trivy image scan — amd64 (HIGH, CRITICAL — exit 1)
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            "${{ env.IMAGE_LOCAL }}-amd64"

      - name: Trivy image scan — arm64 (HIGH, CRITICAL — exit 1)
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            "${{ env.IMAGE_LOCAL }}-arm64"
